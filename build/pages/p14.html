<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../tokens.css">
<style>
  /* P14 — PROOF, CARRIED · recognition above, continuation below.
     Certificate is protected evidence — placed unaltered. The authentic screens
     are the ongoing work. One line: "But I kept building." */
  .page{background:radial-gradient(130% 120% at 26% 8%, #2A2016 0%, #1C140D 52%, #120C08 100%);
    color:#EFE6D6}
  .grain{position:absolute;inset:0;opacity:.55;mix-blend-mode:overlay;pointer-events:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='150'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/></filter><rect width='150' height='150' filter='url(%23n)' opacity='0.05'/></svg>")}

  .folio.tl{top:54px;left:72px;color:#8C7B62}
  .folio.br{bottom:34px;left:72px;color:#8C7B62}

  /* the work — authentic screens as an ongoing, interrupted worktable */
  .work{position:absolute;left:0;top:0;width:1440px;height:960px;pointer-events:none}
  .sheet{position:absolute;border-radius:30px;overflow:hidden;background:#000;
    box-shadow:0 50px 90px -30px rgba(0,0,0,.7),0 12px 30px -10px rgba(0,0,0,.6)}
  .sheet img{display:block;width:100%;height:auto}
  .s1{width:300px;bottom:-250px;left:150px;transform:rotate(-7deg);opacity:.9}
  .s2{width:320px;bottom:-292px;left:430px;transform:rotate(3deg)}
  .s3{width:300px;bottom:-250px;left:742px;transform:rotate(-3deg);opacity:.94}
  .s4{width:284px;bottom:-220px;left:1020px;transform:rotate(6deg);opacity:.86}
  .workveil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,12,8,.0) 44%,rgba(18,12,8,.32) 100%);pointer-events:none}

  /* certificate — protected proof, unaltered */
  .cert{position:absolute;top:96px;left:96px;width:456px;height:352px;border-radius:6px;overflow:hidden;
    transform:rotate(-0.8deg);
    box-shadow:0 40px 80px -28px rgba(0,0,0,.6),0 10px 26px -10px rgba(0,0,0,.55)}
  .cert img{display:block;width:100%;height:auto}
  .certcap{position:absolute;top:470px;left:98px;width:420px}
  .certcap .k{font-family:var(--tech);font-size:11px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--camp-champ)}
  .certcap .d{font-family:var(--sans);font-size:14px;color:#B9AE9B;margin-top:8px;line-height:1.5}

  /* finale line */
  .fin{position:absolute;top:236px;right:96px;width:660px;text-align:right}
  .fin .kick{font-family:var(--tech);font-size:12px;font-weight:500;letter-spacing:.26em;
    text-transform:uppercase;color:#9C8B70}
  .fin .line{font-family:var(--serif);font-weight:400;font-size:66px;line-height:1;letter-spacing:-0.02em;
    margin-top:22px;color:#F6EFE2}
  .fin .line em{font-style:italic;color:inherit}

  .contact{position:absolute;top:398px;right:96px;text-align:right}
  .contact .u{font-family:var(--tech);font-weight:500;font-size:15px;letter-spacing:.06em;color:#EFE6D6}
  .contact .n{font-family:var(--tech);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#8C7B62;margin-top:6px}
</style></head>
<body>
<div class="page">
  <div class="grain"></div>

  <div class="work">
    <div class="sheet s1"><img src="../assets/screens/browse-pets.png" alt="Groovetop work — Browse"></div>
    <div class="sheet s4"><img src="../assets/screens/confirmation.png" alt="Groovetop work — Confirmation"></div>
    <div class="sheet s3"><img src="../assets/screens/schedule-visit.png" alt="Groovetop work — Schedule"></div>
    <div class="sheet s2"><img src="../assets/screens/pet-profile.png" alt="Groovetop work — Pet Profile"></div>
  </div>
  <div class="workveil"></div>

  <div class="folio tl">Groovetop · Case Study</div>
  <div class="folio br">13 / 13 — Proof, Carried</div>

  <div class="cert"><img src="../assets/wgu-cert.png" alt="WGU Excellence Award certificate, awarded to Raymond Merrill II, May 2026"></div>
  <div class="certcap">
    <div class="k">WGU Excellence Award · May 2026</div>
    <div class="d">Awarded to the original prototype. The system came after.</div>
  </div>

  <div class="fin">
    <div class="line">But I kept <em>building.</em></div>
  </div>

  <div class="contact">
    <div class="u">dabombayux.vercel.app</div>
    <div class="n">Raymond Merrill II · Da'Bombay UX</div>
  </div>
</div>
</body></html>
